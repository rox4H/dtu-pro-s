name: CI

on:
  push:
    branches: [main, deploy/stable]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install -e ".[dev]"
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/clean/bin/hoymiles-dtu-reader" version
          "$RUNNER_TEMP/clean/bin/python" -m hoymiles_dtu_reader version
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  npm-client:
    name: JavaScript client on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: packages/npm-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run pack:check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t hoymiles-dtu-reader:ci .
      - name: Run
        run: docker run --rm hoymiles-dtu-reader:ci hoymiles-dtu-reader version
