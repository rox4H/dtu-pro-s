[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hoymiles-dtu-reader"
dynamic = ["version"]
description = "Read Hoymiles microinverter data through a DTU over Modbus TCP and expose a local JSON API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MECC" }]
keywords = ["hoymiles", "dtu", "dtu-pro", "microinverter", "solar", "modbus", "chint", "energy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/rox4H/dtu-pro-s"
Repository = "https://github.com/rox4H/dtu-pro-s"
Issues = "https://github.com/rox4H/dtu-pro-s/issues"
Changelog = "https://github.com/rox4H/dtu-pro-s/blob/main/CHANGELOG.md"

[project.scripts]
hoymiles-dtu-reader = "hoymiles_dtu_reader.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hoymiles_dtu_reader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hoymiles_dtu_reader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
